name: Smoke

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Specific version to install (defaults to latest)
        required: false

permissions:
  contents: read

jobs:
  install:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: Install + import (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Wait for npm registry to index
        if: github.event_name == 'workflow_run'
        run: sleep 30
        shell: bash

      - name: Install
        shell: bash
        run: |
          mkdir smoke && cd smoke
          npm init -y >/dev/null
          if [ -n "${{ inputs.version }}" ]; then
            npm install "@cryptflare/mcp-client@${{ inputs.version }}"
          else
            npm install "@cryptflare/mcp-client@latest"
          fi

      - name: Verify import + exports
        shell: bash
        working-directory: smoke
        run: |
          cat > verify.mjs <<'EOF'
          import { McpClient, McpError } from '@cryptflare/mcp-client';

          if (typeof McpClient !== 'function') {
            throw new Error('McpClient export is not a class');
          }
          if (typeof McpError !== 'function') {
            throw new Error('McpError export is not a class');
          }

          const client = new McpClient({
            endpoint: 'http://127.0.0.1:1/mcp',
            bearer: 'cf_oauth_smoke_test',
          });

          // Confirm the prototype carries the expected MCP methods rather
          // than just being a stub object. Method names come from the
          // canonical MCP transport surface.
          const proto = Object.getPrototypeOf(client);
          const methods = Object.getOwnPropertyNames(proto).filter(
            (k) => typeof proto[k] === 'function' && k !== 'constructor',
          );
          if (methods.length === 0) {
            throw new Error('McpClient exposes no methods');
          }

          console.log('smoke OK -', methods.length, 'McpClient methods');
          EOF
          node verify.mjs
