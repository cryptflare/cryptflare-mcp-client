name: Bug report
description: Report a defect in the MCP client
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Search existing issues first.
        For security vulnerabilities, email security@cryptflare.com - do not open a public issue.
  - type: input
    id: client-version
    attributes:
      label: Client version
      description: Output of `npm list @cryptflare/mcp-client`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: v20.11.1
    validations:
      required: true
  - type: input
    id: mcp-host
    attributes:
      label: MCP host / agent
      placeholder: Claude Desktop, Cursor, Zed, custom, etc.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Smallest possible code snippet or transcript that reproduces the issue.
        Strip any tokens, IDs, secrets - replace with placeholders.
      render: ts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and could not find a duplicate.
          required: true
        - label: I redacted secrets, tokens, and PII from the report.
          required: true
